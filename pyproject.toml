[project]
name = "reword"
version = "0.1.0"
description = "AI-powered text rewriter for your terminal — fix grammar, rephrase, summarize, and more. CLI-first, cross-platform, works system-wide."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["ai", "text", "rewriter", "grammar", "cli", "ollama", "openai", "anthropic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
]

[project.scripts]
reword = "reword.cli:cli"

[project.urls]
Homepage = "https://github.com/digitronik/reword"
Repository = "https://github.com/digitronik/reword"
Issues = "https://github.com/digitronik/reword/issues"
Changelog = "https://github.com/digitronik/reword/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reword"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "integration: marks tests that require external services (deselect with '-m \"not integration\"')",
]
