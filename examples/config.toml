# prosefmt configuration example
# Copy to ~/.config/prosefmt/config.toml (or run: prosefmt config init)
#
# Documentation: https://github.com/digitronik/prosefmt

# Default provider (options: ollama, openai, anthropic, openai-compat)
default_provider = "ollama"

# System prompt applied to every rewrite mode
# Uncomment to customise:
# system_prompt = "You are a text editor. Output ONLY the rewritten text..."

# --- Providers ----------------------------------------------------------------

[providers.ollama]
url = "http://localhost:11434"
model = "qwen2.5:1.5b"

[providers.openai]
# API key: set PROSEFMT_OPENAI_API_KEY or OPENAI_API_KEY env var (never put keys in this file)
model = "gpt-4o-mini"

[providers.anthropic]
# API key: set PROSEFMT_ANTHROPIC_API_KEY or ANTHROPIC_API_KEY env var
model = "claude-haiku-4-5-20251001"

# Use any OpenAI-compatible endpoint (Groq, Together, LM Studio, vLLM, etc.)
# [providers.openai-compat]
# url = "http://localhost:8080/v1"
# model = "local-model"

# --- Custom modes -------------------------------------------------------------
# Add as many as you like — they show up alongside the built-in modes.

[modes.translate-french]
prompt = "Translate to French. Keep technical terms in English."
label = "Translated to French"

[modes.translate-spanish]
prompt = "Translate to Spanish. Keep technical terms in English."
label = "Translated to Spanish"

[modes.code-comments]
prompt = "Add clear, concise comments to this code. Do not change the code itself."
label = "Comments added"
preserve_structure = false

[modes.eli5]
prompt = "Explain this like I'm 5 — simple words, short sentences."
label = "Simplified"

[modes.formal]
prompt = "Rewrite in a formal, academic tone."
label = "Made formal"

[modes.slack]
prompt = "Rewrite for a Slack message — brief, friendly, to the point. Use emoji sparingly."
label = "Slack-ready"
